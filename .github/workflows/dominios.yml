name: Revisar dominios libres
on:
  workflow_dispatch:
    inputs:
      dominios:
        description: "Dominios separados por espacio"
        required: true
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq whois > /dev/null
      - env:
          DOMINIOS: ${{ inputs.dominios }}
        run: |
          for d in $DOMINIOS; do
            out=$(whois "$d" 2>&1)
            if echo "$out" | grep -qiE "no match|not found|no data found|no entries found|object does not exist|status: *free|available"; then
              echo "RESULTADO $d LIBRE"
            else
              echo "RESULTADO $d OCUPADO"
              echo "$out" | grep -iE "creation date|created|expir|registrar:|name server|status" | head -6 | sed "s/^/   $d | /"
            fi
          done
